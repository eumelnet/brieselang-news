apiVersion: batch/v1
kind: CronJob
metadata:
  name: collector
spec:
  schedule: '17 * * * *'
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collector
              image: ghcr.io/eumelnet/brieselang-news:main
              command: [python, manage.py, collect_news]
              envFrom:
                - configMapRef:
                    name: news-config
                - secretRef:
                    name: news-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  memory: 256Mi
