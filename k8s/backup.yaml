apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: database-backup
spec:
  schedule: '35 3 * * *'
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: backup
              image: postgres:17-alpine
              envFrom:
                - secretRef:
                    name: news-secrets
              env:
                - name: PGHOST
                  value: postgres
              command:
                - sh
                - -ec
                - |
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  file="/backups/news-$(date +%Y%m%d-%H%M%S).dump"
                  pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f "$file.tmp"
                  pg_restore --list "$file.tmp" >/dev/null
                  mv "$file.tmp" "$file"
                  find /backups -name '*.dump' -mtime +14 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: backups
